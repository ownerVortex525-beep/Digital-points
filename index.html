<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER-FORCE — OSINT Deep-Dive Module</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src https://fonts.googleapis.com https://fonts.gstatic.com; img-src 'self' data:;">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body data-theme="day" data-app="cyber-force">

  <div id="app-container" class="relative w-full h-screen">

    <div id="network-canvas" class="w-full h-full"></div>

    <div id="ui-container" class="fixed inset-0 z-20 flex flex-col items-center p-2 sm:p-4 pointer-events-none">

      <header class="pointer-events-auto w-full max-w-3xl">
        <div class="flex items-center gap-2 glass-panel p-2 rounded-xl flex-wrap justify-center">
          <div class="flex items-center gap-2 px-3">
            <svg class="w-6 h-6 text-brand-accent" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2L2 7V12C2 17.5 6.5 21.5 12 22C17.5 21.5 22 17.5 22 12V7L12 2Z" stroke="currentColor" stroke-width="2"/>
              <circle cx="12" cy="12" r="4" fill="currentColor"/>
            </svg>
            <h1 class="orbitron text-lg font-bold text-white">CYBER-FORCE</h1>
            <span class="text-xs text-gray-400">OSINT Deep-Dive</span>
          </div>
          <div class="w-px h-8 bg-brand-border hidden sm:block"></div>
          <div id="global-actions" class="flex items-center gap-1 flex-wrap justify-center"></div>
        </div>
      </header>

      <footer class="mt-auto pointer-events-auto w-full max-w-md">
        <div id="entity-palette" class="flex items-center gap-2 glass-panel p-2 rounded-xl flex-wrap justify-center"></div>
      </footer>

    </div>

    <aside id="edit-panel" class="fixed top-4 right-4 h-auto z-20 flex flex-col gap-3 p-4 glass-panel w-72 rounded-xl transition-transform translate-x-[120%]"></aside>

    <div id="toast-container" class="fixed bottom-24 right-4 z-50 flex flex-col gap-2"></div>
    <div id="context-menu" class="fixed z-50 glass-panel p-2 rounded-lg hidden flex-col w-48 text-sm"></div>

    <div id="modal-container" class="hidden fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50">
      <div class="glass-panel rounded-lg p-6 w-full max-w-lg flex flex-col gap-4 mx-4 fade-in">
        <h3 id="modal-title" class="text-lg font-bold"></h3>
        <div id="modal-body" class="text-sm text-gray-300 max-h-[60vh] overflow-y-auto pr-2"></div>
        <input type="text" id="modal-input" class="w-full bg-brand-surface border border-brand-border rounded-md px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-brand-accent">
        <div id="modal-buttons" class="flex justify-end gap-3">
          <button id="modal-cancel" class="px-4 py-2 bg-brand-surface hover:bg-brand-border rounded-md transition-colors duration-200">Cancel</button>
          <button id="modal-ok" class="px-4 py-2 bg-brand-accent text-brand-bg font-semibold hover:bg-brand-accent-hover rounded-md transition-colors duration-200">OK</button>
        </div>
      </div>
    </div>

    <div id="size-slider-container" class="hidden fixed z-30 glass-panel p-2 rounded-lg items-center gap-2 transition-opacity duration-200 opacity-0">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-400">
        <circle cx="12" cy="12" r="10"></circle>
        <circle cx="12" cy="12" r="6"></circle>
        <circle cx="12" cy="12" r="2"></circle>
      </svg>
      <input type="range" id="node-size-slider" class="w-24">
    </div>

    <input type="file" id="add-photo-input" accept="image/*" class="hidden">
    <input type="file" id="load-input" accept=".json" class="hidden">
  </div>

  <div id="drop-overlay" class="hidden fixed inset-0 z-50 bg-sky-500/20 backdrop-blur-sm flex items-center justify-center border-2 border-dashed border-sky-300">
    <div class="text-white text-2xl font-bold drop-shadow-lg">Drop file here</div>
  </div>

  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <defs>
      <symbol id="icon-external-01" viewBox="0 0 24 24"><path d="M7 7L17 17M17 7L7 7L7 17L17 7Z" stroke="currentColor" stroke-width="2" fill="none"/></symbol>
    </defs>
  </svg>

  <script src="js/storage.js"></script>
  <script src="js/osint-data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/osint-deepdive.js"></script>
  <script src="js/telegram-view.js"></script>
  <script src="js/darkweb-view.js"></script>
  <script src="js/deepweb-view.js"></script>
  <script src="js/tracechain.js"></script>
  <script src="js/app.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      CF.App.init();
    });

    function showShortcutsHelp() {
      CF.UI.showShortcuts();
    }
  </script>
</body>
</html>
