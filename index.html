<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CYBER-FORCE — OSINT Deep-Dive</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:;">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

  <script src="js/vis-network.min.js"></script>

  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body data-theme="night" data-app="cyber-force">

  <div id="app-container">

    <div id="network-canvas">
      <div id="canvas-fallback" class="hidden fixed inset-0 flex items-center justify-center z-10">
        <div class="glass-panel p-6 rounded-xl text-center max-w-md">
          <svg class="w-12 h-12 text-accent-color mx-auto mb-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="16" x2="12" y2="12"/>
            <line x1="12" y1="8" x2="12.01" y2="8"/>
          </svg>
          <h3 class="text-lg font-bold mb-2">Canvas Loading...</h3>
          <p class="text-sm text-gray-400">If this persists, check browser console for errors.</p>
        </div>
      </div>
    </div>

    <div id="ui-container">

      <header>
        <div class="glass-panel">
          <div class="flex items-center gap-3 px-3">
            <svg class="w-6 h-6 text-brand-accent" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2L2 7V12C2 17.5 6.5 21.5 12 22C17.5 21.5 22 17.5 22 12V7L12 2Z" stroke="currentColor" stroke-width="2"/>
              <circle cx="12" cy="12" r="4" fill="currentColor"/>
            </svg>
            <h1 class="orbitron">CYBER-FORCE</h1>
            <span class="text-xs text-gray-400">OSINT Deep-Dive</span>
          </div>
          <div class="w-px h-8 bg-brand-border hidden sm:block"></div>
          <div id="global-actions" class="flex items-center gap-1 flex-wrap justify-center"></div>
          <div class="w-px h-8 bg-brand-border hidden sm:block"></div>
          <div class="theme-switcher" id="theme-switcher">
            <button data-theme="night" title="Night">Night</button>
            <button data-theme="day" title="Day">Day</button>
            <button data-theme="cyber" title="Cyber">Cyber</button>
            <button data-theme="forest" title="Forest">Forest</button>
            <button data-theme="ocean" title="Ocean">Ocean</button>
            <button data-theme="midnight" title="Midnight">Midnight</button>
            <button data-theme="auto" title="Auto">Auto</button>
          </div>
        </div>
      </header>

      <footer>
        <div id="entity-palette" class="glass-panel"></div>
      </footer>

    </div>

    <aside id="edit-panel" class="glass-panel"></aside>

    <div id="toast-container"></div>
    <div id="context-menu" class="glass-panel"></div>
    <div id="modal-container" class="glass-panel"></div>

    <div id="size-slider-container" class="glass-panel">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-400">
        <circle cx="12" cy="12" r="10"></circle>
        <circle cx="12" cy="12" r="6"></circle>
        <circle cx="12" cy="12" r="2"></circle>
      </svg>
      <input type="range" id="node-size-slider">
    </div>

    <input type="file" id="add-photo-input" accept="image/*">
    <input type="file" id="load-input" accept=".json">
    <input type="file" id="background-input" accept="image/*">
  </div>

  <div id="drop-overlay">
    <div class="text-2xl font-bold drop-shadow-lg">Drop file here</div>
  </div>

  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <defs>
      <symbol id="icon-external-01" viewBox="0 0 24 24">
        <path d="M7 7L17 17M17 7L7 7L7 17L17 7Z" stroke="currentColor" stroke-width="2" fill="none"/>
      </symbol>
    </defs>
  </svg>

  <script src="js/storage.js"></script>
  <script src="js/osint-data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>

  <script>
    (function() {
      try {
        document.addEventListener('DOMContentLoaded', function() {
          if (window.CF && typeof CF.App.init === 'function') {
            CF.App.init();
          } else {
            console.error('CF.App not available');
          }
        });
      } catch (e) {
        console.error('App initialization failed:', e);
      }
    })();
  </script>
</body>
</html>
